# ==========================================
# Offshore Wind O&M System - Algorithm Config
# Version: v2.1 (Research)
# ==========================================

meta:
  config_version: "v2.1"
  experiment_name: "baseline_svgp_mc_milp"
  author: "jxz"
  created_at: "2026-05-06"

# ========================
# 0. 全局控制参数（强烈建议）
# ========================
global:
  seed: 42
  timezone: "UTC"
  log_level: "INFO"
  device: "cpu"   # cpu / cuda

# ========================
# 1. 预测模块（Prediction）
# ========================
prediction:

  temporal:
    lookback_hours: 72
    forecast_hours: 24
    freq: "1H"   # 数据时间粒度

  svgp:
    num_features: 2
    num_inducing_points: 100
    kernel: "matern_periodic_bundle"
    mean_function: "zero"
    likelihood: "gaussian"

    # 训练参数（在线推理占位，供后续训练管线使用）
    learning_rate: 0.01
    batch_size: 1024
    num_epochs: 50

    # 数值稳定与变分近似
    jitter: 1.0e-4
    whiten: true
    standard_scaler_eps: 1.0e-6
    inducing_noise_scale: 1.0e-5
    inducing_default_low: -2.0
    inducing_default_high: 2.0

    kernel_params:
      matern_nu: 1.5
      daily_period_hours: 24.0
      yearly_period_hours: 8760.0

# ========================
# 2. 场景生成模块（Scenario）
# ========================
scenario:
  num_mc_samples: 1000
  num_clusters: 10

  sampling_method: "gp_posterior"
  reduction_method: "kmedoids"
  kmeans_n_init: 10

  random_state: 42
  mc_variable_jitter_scale: 0.05

# ========================
# 3. 优化模块（MILP）
# ========================
optimization:

  solver: "pulp_cbc"   # 实际求解后端；未来可切换到 gurobi / cplex 等

  planning:
    horizon_hours: 72
    time_step_hours: 1
    big_m_buffer_hours: 24.0

  solver_config:
    time_limit_seconds: 300
    mip_gap: 0.01
    threads: 4

  weather_constraints:
    hard:
      max_wind_speed: 30.0
      max_wave_height: 5.0
    soft:
      # 期望值超过下列软阈值但未触硬阈值时，按惩罚系数计入目标函数
      max_wind_speed: 12.0
      max_wave_height: 1.5
      wind_penalty: 80.0
      wave_penalty: 120.0

# ========================
# 4. 业务与成本模型（Business）
# ========================
business:

  vessel:
    speed_kmh: 25.0
    mobilization_time_h: 0.5
    hourly_cost: 5000.0
    fuel_cost_per_km: 50.0

    operability_limits:
      max_wave_height: 1.5
      max_wind_speed: 12.0

  scheduling:
    downtime_penalty_per_hour: 1000.0
    priority_weight_scale: 0.15

# ========================
# 5. 风场拓扑（Topology）
# ========================
farm_layout:

  coordinate_system: "WGS84"

  depot:
    id: "zhanjiang_port"
    lat: 21.2000
    lon: 110.4000

  turbines:
    - {id: "wtg-01", lat: 20.5100, lon: 110.5100}
    - {id: "wtg-02", lat: 20.5200, lon: 110.5300}
    - {id: "wtg-03", lat: 20.4800, lon: 110.4900}
    - {id: "wtg-04", lat: 20.5300, lon: 110.5000}
    - {id: "wtg-05", lat: 20.5000, lon: 110.4800}
    - {id: "wtg-06", lat: 20.4900, lon: 110.5400}
    - {id: "wtg-07", lat: 20.4700, lon: 110.5200}
    - {id: "wtg-08", lat: 20.5400, lon: 110.5500}
    - {id: "wtg-09", lat: 20.4600, lon: 110.4700}
    - {id: "wtg-10", lat: 20.5500, lon: 110.4600}
    - {id: "wtg-11", lat: 20.4500, lon: 110.5000}
    - {id: "wtg-12", lat: 20.5250, lon: 110.4850}

  distance:
    metric: "haversine"
    cache: true
    earth_radius_km: 6371.0

# ========================
# 6. 运维任务（Scheduling）
# ========================
tasks:
  - turbine_id: "wtg-01"
    duration_h: 2.0
    priority: 3.0
    deadline_h: 48.0

  - turbine_id: "wtg-02"
    duration_h: 3.0
    priority: 2.0
    deadline_h: 72.0

# ========================
# 7. 实验与缓存（Reproducibility）
# ========================
experiment:

  cache:
    enabled: true
    hash_params: true
    cache_dir: "data/04_cache_store"

  logging:
    save_results: true
    save_intermediate: false

# ========================
# 8. 环境控制（Dev / Prod）
# ========================
env:
  mode: "dev"
